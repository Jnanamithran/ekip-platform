services:
  ai-service:
    profiles:
      - ai
    build: ./apps/ai-service
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
      - BACKEND_URL=http://backend:5000
    depends_on:
      - qdrant
      - ollama
    networks:
      - ekip-net

  backend:
    build: ./apps/backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ekip
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the project root .env file}
      - QDRANT_URL=http://qdrant:6333
      - FRONTEND_ORIGINS=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - npx prisma migrate deploy --schema src/prisma/schema.prisma && node src/index.js
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ekip-net

  frontend:
    build: ./apps/frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ekip-net

  qdrant:
    profiles:
      - ai
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ekip-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ekip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ekip"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ekip-net

  ollama:
    profiles:
      - ai
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ekip-net

volumes:
  qdrant_data:
  postgres_data:
  ollama_data:

networks:
  ekip-net:
    driver: bridge
