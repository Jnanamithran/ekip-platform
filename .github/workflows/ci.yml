name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ai-lint-test:
    name: AI Service — Lint + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI dependencies
        run: |
          cd apps/ai-service
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio httpx

      - name: Lint Python (flake8)
        run: |
          cd apps/ai-service
          flake8 . --exclude venv,__pycache__,.pytest_cache \
            --max-line-length 100 \
            --ignore E501,W503

      - name: Run AI unit tests (mocked — no real services)
        # NOTE: only the real pytest files are run explicitly. The tests/
        # directory also contains demo scripts (test_citations.py,
        # test_generation.py, test_hybrid.py, test_reranker.py, demo.py) that
        # require live Qdrant/Ollama and break pytest collection, so a bare
        # `pytest tests/` (or `-m "not integration and not e2e"`, which no
        # test uses) would fail in CI.
        run: |
          cd apps/ai-service
          pytest tests/test_ask_endpoint.py tests/test_citation_extractor.py tests/test_ingest_endpoint.py tests/test_pdf_parser_ocr.py -v \
            --tb=short

  backend-lint:
    name: Backend — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: cd apps/backend && npm install

      - name: Lint backend
        run: cd apps/backend && npm run lint || echo "No lint script — skipping"

  frontend-lint-build:
    name: Frontend — Lint + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: cd apps/frontend && npm install

      - name: Lint frontend
        run: cd apps/frontend && npm run lint || echo "No lint script"

      - name: Build frontend
        run: cd apps/frontend && npm run build
        env:
          VITE_API_URL: http://localhost:5000
